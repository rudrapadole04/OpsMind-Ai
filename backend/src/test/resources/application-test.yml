spring:
  datasource:
    url: jdbc:h2:mem:opsmind_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false

opsmind:
  rag:
    chunk-size: 500
    chunk-overlap: 100
    similarity-threshold: 0.60
    max-retrieved-chunks: 5
    fallback-message: "I am not able to answer this based on the provided corporate SOPs."
